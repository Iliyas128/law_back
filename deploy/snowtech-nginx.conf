# Пример для www.snowtech.asia: фронт в /lawAi/, API без CORS через proxy.
# Замените YOUR_BACKEND на реальный URL Vercel, например law-back-xxxx.vercel.app

location /lawAi/api/ {
    proxy_pass https://YOUR_BACKEND.vercel.app/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host YOUR_BACKEND.vercel.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
